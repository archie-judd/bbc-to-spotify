[project]
name = "bbc-to-spotify"
version = "0.0.7"
description = "A CLI tool for adding the BBC radio playlist tracks to Spotify playlists."
authors = [{ name = "Archie Judd" }]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.12,<5.0.0",
    "requests>=2.31.0,<3.0.0",
    "pydantic>=2.0,<3.0.0",
]

[project.scripts]
bbc-to-spotify = "bbc_to_spotify.main:main"

[dependency-groups]
dev = [
    "pylint>=2.17.4,<3.0.0",
    "black>=24.8.0,<25.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bbc_to_spotify"]
